<header class="weather-header">
  <div class="header-group">
    <button class="icon-button" type="button" aria-label="Abrir menu">
      <span class="menu-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <h1 class="header-title">
      <img class="header-logo" src="icons/icon-24x24.png" width="24" height="24" alt="" aria-hidden="true" />
      {{ title }}
    </h1>
  </div>

  <div class="header-group">
    @if (notificationsSupported) {
      <button
        class="icon-button"
        type="button"
        [attr.aria-label]="notificationsEnabled ? 'Notificaciones activadas' : 'Activar notificaciones'"
        [class.is-active]="notificationsEnabled"
        (click)="onToggleNotifications()">
        <span class="bell-icon" aria-hidden="true"></span>
      </button>
    }

    <button class="icon-button" type="button" aria-label="Buscar ciudad">
      <span class="search-icon" aria-hidden="true"></span>
    </button>
  </div>
</header>
