<div class="rain-radar" [class.is-expanded]="isExpanded">
  <div #radarMap class="rain-radar-map" role="img" aria-label="Mapa de radar de lluvia"></div>

  <button
    type="button"
    class="rain-radar-expand-btn"
    (click)="toggleExpand()"
    [attr.aria-label]="isExpanded ? 'Salir de pantalla completa' : 'Ver en pantalla completa'"
  >
    {{ isExpanded ? '✕' : '⛶' }}
  </button>

  @if (isLoading) {
    <div class="rain-radar-overlay">
      <span class="rain-radar-spinner" aria-hidden="true"></span>
      <p>Cargando radar...</p>
    </div>
  } @else if (errorMessage) {
    <div class="rain-radar-overlay">
      <p class="rain-radar-error">{{ errorMessage }}</p>
    </div>
  }

  @if (!isLoading && !errorMessage) {
    <div class="rain-radar-controls">
      <button type="button" class="rain-radar-play" (click)="togglePlayback()">
        {{ isPlaying ? '⏸ Pausar' : '▶ Reproducir' }}
      </button>
      <span class="rain-radar-time">{{ frameTimeLabel }}</span>
    </div>
  }
</div>
